# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Spring ──────────────────────────────────────────────────────────────────
spring.application.name=public-transport-tracker
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# ── Transit API: MTA ────────────────────────────────────────────────────────
transit.api.mta.base-url=${MTA_BASE_URL:https://api.mta.info}
# Optional — MTA public endpoints work without a key
transit.api.mta.api-key=${MTA_API_KEY:}
# Quick timeout - fail fast and use TransitLand instead
transit.api.mta.timeout-ms=${MTA_TIMEOUT_MS:5000}

# ── Transit API: TransitLand ────────────────────────────────────────────────
transit.api.transitland.base-url=${TRANSITLAND_BASE_URL:https://transit.land/api/v2/rest}
transit.api.transitland.api-key=${TRANSITLAND_API_KEY:BTdcRhsRSVM2qXdjqFw9bFFtPxZshBkd}
# Increased timeout - this is now primary API
transit.api.transitland.timeout-ms=${TRANSITLAND_TIMEOUT_MS:5000}

# ── Transit API: SEPTA ──────────────────────────────────────────────────────
transit.api.septa.base-url=${SEPTA_BASE_URL:https://www3.septa.org}
transit.api.septa.timeout-ms=${SEPTA_TIMEOUT_MS:5000}

# ── Transit API: TfL ────────────────────────────────────────────────────────
transit.api.tfl.base-url=${TFL_BASE_URL:https://api.tfl.gov.uk}
transit.api.tfl.api-key=${TFL_API_KEY:}
transit.api.tfl.timeout-ms=${TFL_TIMEOUT_MS:5000}

# ── Cache ───────────────────────────────────────────────────────────────────
transit.cache.ttl-seconds=${CACHE_TTL_SECONDS:300}
transit.cache.stale-ttl-seconds=${CACHE_STALE_TTL_SECONDS:3600}
transit.cache.max-size=${CACHE_MAX_SIZE:1000}

# ── Delay threshold ────────────────────────────────────────────────────────
transit.delays.significant-threshold-minutes=15

# ── Offline mode ────────────────────────────────────────────────────────────
transit.offline.enabled=${OFFLINE_MODE:false}

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.app.name=Public Transport Tracker
management.info.app.version=1.0.0
management.info.app.description=Real-time public transport tracking microservice

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.transport.tracker=INFO
logging.level.org.springframework=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
