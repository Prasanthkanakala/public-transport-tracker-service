plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.transport'
version = '1.0.0'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT (JSON Web Token)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // GTFS Realtime for MTA protobuf parsing
    implementation 'org.mobilitydata:gtfs-realtime-bindings:0.0.8'
    implementation 'com.google.protobuf:protobuf-java:3.25.1'

    // Observability: Metrics and Monitoring (Option B)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-core'
    
    // Observability: Structured Logging (Option B)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    
    // Karate BDD Testing
    testImplementation 'com.intuit.karate:karate-junit5:1.4.1'
    testImplementation 'com.intuit.karate:karate-core:1.4.1'
}

test {
    useJUnitPlatform {
        // Exclude Karate BDD integration tests from the standard test task.
        // These tests require a running server (localhost:8080) and should be
        // run separately via the 'karateTest' task after the application is deployed.
        excludeTags 'regression'
    }
    exclude '**/bdd/**'
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        showStandardStreams true
    }
}

// Separate task for Karate BDD integration tests.
// Run with: ./gradlew karateTest (requires a running server at localhost:8080)
task karateTest(type: Test) {
    useJUnitPlatform()
    include '**/bdd/**'
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        showStandardStreams true
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com.transport.tracker.TransportTrackerApplication'
    }
}