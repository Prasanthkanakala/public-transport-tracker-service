  name: dev-transport-frontend
  namespace: transport-tracker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: transport-frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: transport-frontend
        app.kubernetes.io/part-of: transport-tracker
    spec:
      containers:
      - image: us-central1-docker.pkg.dev/burner-kanprasa1-01/transport-tracker/transport-frontend:dev-latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /index.html
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
        name: frontend
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /index.html
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx-config
          readOnly: true
          subPath: default.conf
      securityContext:
        runAsNonRoot: false
      serviceAccountName: dev-transport-tracker-sa
      terminationGracePeriodSeconds: 15
      volumes:
      - configMap:
          name: dev-frontend-nginx-config
        name: nginx-config
