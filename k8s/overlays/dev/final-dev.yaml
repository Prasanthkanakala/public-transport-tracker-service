    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: transport-backend
    app.kubernetes.io/part-of: transport-tracker
  name: dev-transport-backend-hpa
  namespace: transport-tracker
spec:
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 1
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 2
      stabilizationWindowSeconds: 60
  maxReplicas: 2
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  - resource:
      name: memory
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
