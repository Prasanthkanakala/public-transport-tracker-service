# ─────────────────────────────────────────────────────────────────
# Horizontal Pod Autoscaler for Frontend
# ─────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transport-frontend-hpa
  namespace: transport-tracker
  labels:
    app.kubernetes.io/name: transport-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: transport-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transport-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
