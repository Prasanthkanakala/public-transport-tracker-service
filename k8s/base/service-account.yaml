# ─────────────────────────────────────────────────────────────────
# Kubernetes ServiceAccount for workload identity
# Bind to a GCP Service Account via Workload Identity for
# secure access to GCP resources (GAR, Cloud SQL, etc.)
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transport-tracker-sa
  namespace: transport-tracker
  labels:
    app.kubernetes.io/part-of: transport-tracker
  annotations:
    # Workload Identity – bind to GCP SA for pulling images from GAR
    # Replace with your actual GCP project and service account
    iam.gke.io/gcp-service-account: transport-tracker-sa@YOUR_GCP_PROJECT_ID.iam.gserviceaccount.com
