# ─────────────────────────────────────────────────────────────────
# Frontend Service – ClusterIP (exposed via Ingress)
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: transport-frontend
  namespace: transport-tracker
  labels:
    app.kubernetes.io/name: transport-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: transport-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: transport-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
